<title>Ship Week</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Pyidaungsu 2.5.3 (MCF), embedded so Burmese renders in it everywhere; Latin falls through to the system face */
__FONTFACE__
/* Layout: one 880px column; home is a week board of seven day tiles, play turns the card into a small dev workspace (chat, terminal, diff, console, phone) */
:root{
 --bg:#f6f7fb;--surface:#fff;--surface-2:#f1f2f8;--text:#1a1b23;--muted:#5d6172;--faint:#8a8ea0;
 --line:rgba(22,26,52,.08);--line-strong:rgba(22,26,52,.15);--accent:#4f5bd5;--on-accent:#fff;--tint:rgba(79,91,213,.09);--tint-strong:rgba(79,91,213,.16);
 --good:#2f7d4f;--good-tint:rgba(47,125,79,.1);--bad:#c2410c;--bad-tint:rgba(194,65,12,.09);--warn:#a8741a;
 --shadow:0 1px 2px rgba(22,28,70,.04),0 14px 40px -12px rgba(22,28,70,.12);--scrim:rgba(20,22,34,.35);
 --r-lg:22px;--r-md:16px;--r-sm:11px;
 --font:"Pyidaungsu",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Pyidaungsu",monospace;
 --term-bg:#14151b;--term-tx:#d7d9e4;--term-dim:#7d8094;--term-ok:#7ad69b;--term-err:#ff8a6b;--term-acc:#9aa3f6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#14151a;--surface:#1b1c23;--surface-2:#23242d;--text:#e8e9f0;--muted:#a0a3b5;--faint:#757889;
 --line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.13);--accent:#8f98f3;--on-accent:#14151a;--tint:rgba(143,152,243,.1);--tint-strong:rgba(143,152,243,.18);
 --good:#6cc58f;--good-tint:rgba(108,197,143,.12);--bad:#f0956a;--bad-tint:rgba(240,149,106,.12);--warn:#e0b25c;
 --shadow:none;--scrim:rgba(0,0,0,.55);--term-bg:#0d0e12;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#14151a;--surface:#1b1c23;--surface-2:#23242d;--text:#e8e9f0;--muted:#a0a3b5;--faint:#757889;
 --line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.13);--accent:#8f98f3;--on-accent:#14151a;--tint:rgba(143,152,243,.1);--tint-strong:rgba(143,152,243,.18);
 --good:#6cc58f;--good-tint:rgba(108,197,143,.12);--bad:#f0956a;--bad-tint:rgba(240,149,106,.12);--warn:#e0b25c;
 --shadow:none;--scrim:rgba(0,0,0,.55);--term-bg:#0d0e12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.8 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:880px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code,.mono{font-family:var(--mono);font-size:.88em}

/* header + meters */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:20px;height:20px;color:var(--accent)}
.meters{display:flex;gap:14px;flex-wrap:wrap}
.meter{display:grid;grid-template-columns:auto 64px auto;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.meter .bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:9px;background:var(--good);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter .bar i.mid{background:var(--warn)}.meter .bar i.low{background:var(--bad)}
.meter b{font:600 12px var(--mono);color:var(--text);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

/* type */
.eyebrow{font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:36px;line-height:1.45;letter-spacing:-.025em;font-weight:700;margin:0 0 10px;text-wrap:balance}
h2{font-size:22px;line-height:1.55;letter-spacing:-.015em;font-weight:700;margin:0 0 6px;text-wrap:balance}
h3{font-size:16px;margin:0 0 4px}
.lede{color:var(--muted);font-size:17px;margin:0;max-width:640px}
.sub{font:700 13.5px var(--font);margin:52px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sub small{font:500 12px var(--mono);color:var(--faint)}
p{margin:0 0 12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer;transition:border-color .2s,transform .15s,opacity .2s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover{opacity:.92}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0}

/* home */
.hero{padding:40px 0 4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:28px}
.day{position:relative;text-align:left;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:14px 12px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:150px;transition:transform .2s,border-color .2s;box-shadow:var(--shadow)}
.day:hover:not([disabled]){transform:translateY(-2px);border-color:var(--line-strong)}
.day .dn{font:600 11px var(--mono);color:var(--faint);letter-spacing:.04em;padding-right:16px}
.day .dw{font-size:14px;font-weight:700;line-height:1.5}
.day .dp{font-size:12.5px;color:var(--muted);line-height:1.6}
.day .st{margin-top:auto;display:flex;gap:2px;padding-top:8px}
.day .st svg{width:14px;height:14px}
.day.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.day.next .dn{color:var(--accent)}
.day[disabled]{cursor:not-allowed;background:var(--surface-2);box-shadow:none;opacity:.7}
.day .lock{position:absolute;right:10px;top:12px;width:14px;height:14px;color:var(--faint)}
.star{color:var(--line-strong)}.star.on{color:var(--warn)}
.cta{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
.cta p{margin:0;color:var(--muted);font-size:14.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cc{text-align:left;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:84px;transition:border-color .2s}
.cc:hover{border-color:var(--line-strong)}
.cc b{font-size:14px;line-height:1.5}
.cc span{font-size:12.5px;color:var(--faint);line-height:1.6}
.cc .mono{font-size:12.5px;font-weight:600;color:var(--text)}
.cc.lock{background:var(--surface-2);border-style:dashed;cursor:default}
.cc.lock b{color:var(--faint)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font-size:14.5px;color:var(--muted)}
.how b{display:block;color:var(--text);margin-bottom:2px}
footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer .sync::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:7px;vertical-align:middle}
footer .sync.cloud::before{background:var(--good)}

/* play shell */
.phead{display:flex;align-items:center;gap:12px;padding:18px 0 18px}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;color:var(--muted)}
.x:hover{color:var(--text)}
.segs{flex:1;display:flex;gap:5px;min-width:0}
.segs i{flex:1;height:5px;border-radius:9px;background:var(--line-strong)}
.segs i.done{background:var(--accent)}.segs i.cur{background:var(--text)}
.phead .tag{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.stage{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);padding:24px}
.story{background:var(--surface-2);border-radius:var(--r-md);padding:12px 16px;margin:4px 0 18px;font-size:15px;color:var(--muted)}
.story b{color:var(--text)}
.ask{font-weight:700;font-size:16px;margin:18px 0 10px}

/* choices */
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:11px 14px;cursor:pointer;transition:border-color .15s,background .15s;min-width:0;font-size:15px;line-height:1.7}
.opt:hover:not([disabled]){border-color:var(--faint)}
.opt .k{font:600 11px var(--mono);border:1px solid var(--line-strong);border-radius:5px;padding:0 6px;color:var(--faint);margin-top:4px;flex:none}
.opt.sel{border-color:var(--accent);background:var(--tint)}
.opt.right{border-color:var(--good);background:var(--good-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.chk{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:10px 14px;cursor:pointer;font-size:15px;line-height:1.7;width:100%}
.chk::before{content:"";width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);flex:none;margin-top:5px;background:var(--surface)}
.chk.sel{border-color:var(--accent);background:var(--tint)}
.chk.sel::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.chk.right{border-color:var(--good);background:var(--good-tint)}
.chk.wrong{border-color:var(--bad);background:var(--bad-tint)}
.chk.miss{border-style:dashed;border-color:var(--good)}
.chk[disabled]{cursor:default}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.counter{font:600 12.5px var(--mono);color:var(--muted)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.msg{max-width:88%;padding:9px 14px;border-radius:16px;font-size:15px;line-height:1.75;animation:rise .3s ease both}
.msg small{display:block;font:600 11px var(--mono);color:var(--faint);margin-bottom:1px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.msg.me small{color:inherit;opacity:.7}
.msg.ag{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:none;border:1px dashed var(--line-strong);font-size:13.5px;color:var(--muted);border-radius:10px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:4px;animation:blink 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* code + file panes */
.file{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin:10px 0;background:var(--surface)}
.file .fh{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;background:var(--surface-2);font:600 12px var(--mono);color:var(--muted);flex-wrap:wrap}
.file pre{margin:0;padding:12px 14px;font:12.5px/1.75 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.copy{font:600 11.5px var(--font);border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:1px 9px;cursor:pointer;color:var(--muted)}
.copy.done{color:var(--accent);border-color:var(--accent)}
.pr{border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;margin-top:10px;animation:rise .35s ease both}
.pr .ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.pr .ph b{font-size:15px}
.pr .ph span{font:500 12px var(--mono);color:var(--faint)}
.pr ul{list-style:none;margin:0;padding:8px 16px}
.pr li{display:flex;justify-content:space-between;gap:10px;font:12.5px/2 var(--mono);border-bottom:1px dashed var(--line)}
.pr li:last-child{border-bottom:0}
.pr li em{font-style:normal;white-space:nowrap}
.add{color:var(--good)}.del{color:var(--bad)}
.pr .pn{padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.pr .pn div{display:flex;gap:8px;margin:2px 0}
.pr .pn div::before{content:"";width:6px;height:6px;border-radius:50%;margin-top:11px;flex:none;background:var(--bad)}
.pr .pn div.ok::before{background:var(--good)}
.pr .pn div.nt::before{background:var(--warn)}

/* prompt composer */
.slot{margin-top:14px}
.slot .sl{font:700 12px var(--mono);letter-spacing:.04em;color:var(--accent);margin-bottom:6px}
.preview{margin-top:16px}

/* terminal */
.term{background:var(--term-bg);color:var(--term-tx);border-radius:var(--r-md);overflow:hidden;font:13px/1.7 var(--mono);border:1px solid var(--line)}
.term .tb{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--term-dim);font-size:11.5px}
.term .tb i{width:10px;height:10px;border-radius:50%;background:#3a3c48}
.term .tb span{margin-left:8px}
.term .out{padding:10px 14px;min-height:150px;max-height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.term .out .c{color:var(--term-tx)}.term .out .c::before{content:"$ ";color:var(--term-acc)}
.term .out .d{color:var(--term-dim)}.term .out .ok{color:var(--term-ok)}.term .out .er{color:var(--term-err)}
.term .out .h{color:var(--term-acc)}
.term .out button.cid{background:none;border:0;padding:0;color:#f0c674;text-decoration:underline dotted;cursor:pointer;font:inherit}
.term .in{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;border-top:1px solid rgba(255,255,255,.07)}
.term .in label{color:var(--term-acc);white-space:nowrap;font-size:12px}
.term .in input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--term-tx);font:13px var(--mono);caret-color:var(--term-acc)}
.term .in button{background:#2a2c38;border:0;color:var(--term-tx);border-radius:6px;padding:3px 10px;font:600 12px var(--mono);cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font:12.5px var(--mono);border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--faint)}
.chip.hint{border-color:var(--accent);background:var(--tint);animation:pulse 1.2s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--tint)}}
.goals{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px}
.goals li{display:flex;gap:10px;font-size:14.5px;color:var(--muted);align-items:flex-start}
.goals li::before{content:"";width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;margin-top:5px}
.goals li.cur{color:var(--text);font-weight:600}
.goals li.cur::before{border-color:var(--accent);background:var(--tint)}
.goals li.done{color:var(--faint);text-decoration:line-through}
.goals li.done::before{background:var(--good);border-color:var(--good)}
.appview{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.appview::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.appview.broken{background:var(--bad-tint);border-color:var(--bad)}
.appview.broken::before{background:var(--bad)}

/* console + diff (clickable lines) */
.lines{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;font:12.5px/1.7 var(--mono);background:var(--surface)}
.lines .fh{padding:7px 12px;background:var(--surface-2);font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ln{display:flex;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:5px 12px;cursor:pointer;font:inherit;color:var(--text);overflow-wrap:anywhere}
.ln:hover:not([disabled]){background:var(--surface-2)}
.ln .lv{flex:none;width:44px;color:var(--faint);font-size:11px;padding-top:1px}
.ln.err{background:var(--bad-tint)}.ln.err .lv{color:var(--bad)}
.ln.warn .lv{color:var(--warn)}
.ln.plus{background:var(--good-tint)}.ln.minus{background:var(--bad-tint)}
.ln .sg{flex:none;width:12px;color:var(--faint)}
.ln.sel{box-shadow:inset 3px 0 0 var(--accent);background:var(--tint)}
.ln.flag-ok{box-shadow:inset 3px 0 0 var(--good)}
.ln.flag-miss{box-shadow:inset 3px 0 0 var(--bad)}
.ln.flag-false{box-shadow:inset 3px 0 0 var(--warn)}
.ln[disabled]{cursor:default}
.diffs{display:grid;gap:10px}

/* sort cards */
.sort{display:grid;gap:8px}
.si{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px 8px 14px;background:var(--surface);flex-wrap:wrap}
.si span{font-size:14.5px;min-width:0}
.si .seg{display:flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;flex:none}
.si .seg button{border:0;background:var(--surface);padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.si .seg button+button{border-left:1px solid var(--line-strong)}
.si .seg button.on{background:var(--text);color:var(--surface)}
.si.right{border-color:var(--good);background:var(--good-tint)}
.si.wrong{border-color:var(--bad);background:var(--bad-tint)}

/* npm cards */
.npms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.npm{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface);font-size:13px;display:grid;gap:4px}
.npm b{font:600 13.5px var(--mono);overflow-wrap:anywhere}
.npm dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;color:var(--muted)}
.npm dt{color:var(--faint)}.npm dd{margin:0;font-family:var(--mono);font-size:12.5px;color:var(--text);min-width:0;overflow-wrap:anywhere}

/* email */
.mail{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.mail .mh{padding:10px 14px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.mail .mh b{color:var(--text)}
.mail .mb{padding:12px 14px;font-size:14.5px}
.order{display:grid;gap:8px}
.order .opt .k{min-width:22px;text-align:center}

/* phone QA */
.qa{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.phone{border:10px solid #1c1d24;border-radius:34px;background:#fff;color:#1a1b23;height:520px;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font);box-shadow:0 0 0 1px var(--line-strong),0 20px 40px -18px rgba(0,0,0,.35)}
.phone .sb{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font:600 11px -apple-system,system-ui,sans-serif;color:#1a1b23}
.phone .ah{padding:6px 16px 10px;border-bottom:1px solid #ececf2}
.phone .ah b{font-size:17px}
.phone .ah small{display:block;font-size:11.5px;color:#8a8ea0}
.phone .bd{flex:1;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;gap:8px;position:relative}

/* ---------- progress ---------- */
const DAY=864e5,INT=[0,1,2,4,8,16],LS='ship-week-v1';
const blank=()=>({v:1,days:{},lessons:{},updatedAt:0});
let S=(()=>{try{const t=localStorage.getItem(LS);return t?{...blank(),...JSON.parse(t)}:blank()}catch(e){return blank()}})();
let remote=null,wT=0,writing=false,dirty=false;
function persist(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(remote){dirty=true;clearTimeout(wT);wT=setTimeout(flush,1500)}}
function flush(){if(!remote||writing||!dirty)return;writing=true;dirty=false;
 remote.set({state:JSON.parse(JSON.stringify(S)),updatedAt:S.updatedAt}).catch(e=>{if(e&&['invalid_argument','revoked','not_granted'].includes(e.code)){remote=null;setSync(false)}}).finally(()=>{writing=false;if(dirty)flush()})}
function setSync(c){const el=$('#sync');el.className='sync'+(c?' cloud':'');el.textContent=c?'Progress ကို account ထဲ သိမ်းထားတယ်':'ဒီ browser ထဲမှာ သိမ်းထားတယ်'}
async function initSync(){
 if(!window.claude||!window.claude.use)return;
 try{const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
  const uid=await user.id();if(!uid)return;const ref=db.doc('data/users/'+uid+'/progress');const snap=await ref.get();const r=snap.exists?snap.data():null;
  remote=ref;setSync(true);
  if(r&&r.state&&(r.state.updatedAt||0)>(S.updatedAt||0)){S={...blank(),...JSON.parse(JSON.stringify(r.state))};try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(view==='home')home();meters()}
  else if(S.updatedAt){dirty=true;flush()}
 }catch(e){remote=null;setSync(false)}
}
function gradeLesson(id,ok){const c={...(S.lessons[id]||{b:0,due:0,r:0,w:0})},now=Date.now();
 if(ok){c.b=Math.min(5,c.b+1);c.r++;c.due=now+INT[c.b]*DAY-3*36e5}else{c.b=0;c.w++;c.due=now}S.lessons[id]=c}
const dueLessons=()=>Object.keys(S.lessons).filter(id=>S.lessons[id].due<=Date.now());
const dayDone=n=>!!(S.days[n]&&S.days[n].done);
const unlocked=n=>n===1||dayDone(n-1);
function totals(){let h=100,s=100,b=50;for(const k in S.days){const f=S.days[k].fx||{};h+=f.h||0;s+=f.s||0;b+=f.b||0}return {h:clamp(h,0,100),s:clamp(s,0,100),b:Math.max(0,b)}}
function meters(){const t=totals();
 const m=(label,v,max,fmt)=>{const p=v/max*100;return `<div class="meter"><span>${label}</span><div class="bar"><i class="${p<40?'low':p<70?'mid':''}" style="width:${p}%"></i></div><b>${fmt(v)}</b></div>`};
 $('#meters').innerHTML=m('App health',t.h,100,v=>v)+m('Security',t.s,100,v=>v)+m('Budget',t.b,50,v=>'$'+v);
}

let view='home',RUN=null;
function playDay(n){const d=DAYS[n-1];RUN={n,steps:d.steps(),i:0,res:[]};view='play';renderStep();window.scrollTo(0,0)}
function renderStep(){
 const d=DAYS[RUN.n-1];

 <div class="stage" id="stage"><div id="sbody"></div></div>`;

 RUN.steps[RUN.i]($('#sbody'),finishStep);
}
function fxChips(fx){const out=[];
 if(fx.h)out.push(`<span class="${fx.h<0?'neg':'pos'}">App health ${fx.h>0?'+':''}${fx.h}</span>`);
 if(fx.s)out.push(`<span class="${fx.s<0?'neg':'pos'}">Security ${fx.s>0?'+':''}${fx.s}</span>`);
 if(fx.b)out.push(`<span class="${fx.b<0?'neg':'pos'}">Budget ${fx.b>0?'+$':'-$'}${Math.abs(fx.b)}</span>`);
 return out.length?`<div class="fx">${out.join('')}</div>`:'<div class="fx"><span class="pos">ထိခိုက်မှု မရှိ</span></div>'}
function lessonBox(id,ok){const l=L[id];return `<div class="lesson"><div class="lt"><span>သင်ခန်းစာ</span><span class="${ok?'okk':'nok'}">${ok?'မှန်တယ်':'ပြန်လာမယ်'}</span></div><b>${esc(l.t)}</b><p>${esc(l.why)}</p></div>`}
function finishStep(r){
 r.fx=r.fx||{};r.lessons=r.lessons||[];RUN.res.push(r);
 r.lessons.forEach(x=>gradeLesson(x.id,x.ok));persist();
 const cls=r.score>=.9?'ok':r.score>=.5?'mid':'no';
 const el=document.createElement('div');el.className='fb '+cls;
 el.innerHTML=`<div class="fb-h"><b>${esc(r.head||(cls==='ok'?'ကောင်းတယ်':cls==='mid'?'တစ်ဝက်တစ်ပျက်':'မှားသွားတယ်'))}</b>${fxChips(r.fx)}</div>${r.body?`<div class="why">${r.body}</div>`:''}${r.lessons.map(x=>lessonBox(x.id,x.ok)).join('')}
 <div class="row end" style="margin-top:14px"><button class="btn pri" id="next" type="button">${RUN.i+1<RUN.steps.length?'ဆက်သွားမယ် →':'ဒီနေ့ ပြီးပြီ →'}</button></div>`;
 $('#stage').appendChild(el);bindCopy(el);
 $('#next').onclick=()=>{RUN.i++;if(RUN.i<RUN.steps.length){renderStep();$('#stage').scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'})}else endDay()};
 el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
}
function endDay(){
 const n=RUN.n,d=DAYS[n-1],res=RUN.res;
 const avg=res.reduce((a,r)=>a+r.score,0)/res.length,stars=avg>=.9?3:avg>=.6?2:1;
 const fx={h:0,s:0,b:0};res.forEach(r=>{fx.h+=r.fx.h||0;fx.s+=r.fx.s||0;fx.b+=r.fx.b||0});
 const prev=S.days[n]||{},first=!prev.done;
 S.days[n]={done:true,stars:Math.max(prev.stars||0,stars),last:stars,fx,miss:[...new Set(res.flatMap(r=>r.lessons.filter(x=>!x.ok).map(x=>x.id)))]};
 persist();meters();
 if(n===7){launch(first);return}
 const tools=TOOLS.filter(t=>t.day===n),gl=GLOSS_DAY[n]||[];
 view='summary';RUN=null;
 $('#view').innerHTML=`<section class="hero"><p class="eyebrow">Day ${n} · ${esc(d.w)} · ${d.phase} · ပြီးပြီ</p>
 <div class="stars">${[1,2,3].map(i=>`<span class="star ${i<=stars?'on':''}" style="animation-delay:${i*.15}s">${STAR.replace('<svg','<svg class="'+(i<=stars?'on':'')+'" style="animation-delay:'+i*.18+'s"')}</span>`).join('')}</div>

 <p class="lede">${fx.h||fx.s||fx.b?'ဒီနေ့ ဆုံးဖြတ်ချက်တွေကြောင့် app အခြေအနေ ပြောင်းသွားတယ်။':'ဒီနေ့ app ကို ဘာမှ မထိခိုက်ခဲ့ဘူး။'} မှားခဲ့တဲ့ သင်ခန်းစာတွေက warm-up ထဲမှာ ပြန်လာမယ်။</p>

   $$('#o .opt').forEach(x=>{x.disabled=true;x.classList.add(o[+x.dataset.k].c?'right':x===b?'wrong':'dim')});
   const fb=document.createElement('div');fb.className='fb '+(right?'ok':'no');fb.innerHTML=`<div class="fb-h"><b>${right?'မှန်တယ်':'မှားသွားတယ်'}</b></div><div class="why"><p>${esc(l.why)}</p></div><div class="row end"><button class="btn pri" id="next" type="button">${i+1<ids.length?'ဆက်သွားမယ် →':'ပြီးပြီ'}</button></div>`;
